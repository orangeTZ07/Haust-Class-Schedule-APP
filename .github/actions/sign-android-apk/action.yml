name: Sign Android APK
description: Sign a release APK with the project keystore, so upgrades install in place.

# Why this is shared rather than inlined in each workflow: ci.yml and release-android.yml
# both need to sign, and two copies of the same keytool/apksigner invocation drift apart.
#
# Composite actions cannot read `secrets` directly, so every secret arrives as an input and
# the calling workflow does the `${{ secrets.X }}` lookup.

inputs:
  unsigned-apk:
    description: Path to the APK produced by the build.
    required: true
  output-apk:
    description: Path to write the signed APK to.
    required: true
  keystore-base64:
    description: Base64 of the release keystore. Empty falls back to a throwaway key.
    required: false
    default: ""
  keystore-password:
    description: Keystore password.
    required: false
    default: ""
  key-alias:
    description: Key alias inside the keystore.
    required: false
    default: ""
  key-password:
    description: Password for that key.
    required: false
    default: ""

outputs:
  signed-apk:
    description: Path of the signed APK.
    value: ${{ steps.sign.outputs.signed }}

runs:
  using: composite
  steps:
    - name: Sign
      id: sign
      shell: bash
      env:
        KS_B64: ${{ inputs.keystore-base64 }}
        KS_PASS: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASS: ${{ inputs.key-password }}
        UNSIGNED_APK: ${{ inputs.unsigned-apk }}
        OUTPUT_APK: ${{ inputs.output-apk }}
      run: |
        set -euo pipefail

        KEYSTORE="${RUNNER_TEMP}/release.jks"
        rm -f "$KEYSTORE"
        BUILD_TOOLS="$(ls -1 "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -n 1)"
        APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

        if [ -n "$KS_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_PASS" ]; then
          # The real keystore. Every way this can go wrong names itself. A previous revision
          # let a failure here surface as a bare "Process completed with exit code 2", which
          # says nothing about which of the four secrets is wrong.
          if ! printf '%s' "$KS_B64" | base64 -d > "$KEYSTORE" 2>/dev/null; then
            echo "::error title=ANDROID_KEYSTORE_BASE64 is not valid base64::Could not decode the ${#KS_B64} characters received. It must be the *contents* of the .b64 file, not its path: [Convert]::ToBase64String([IO.File]::ReadAllBytes('haust-release.jks'))"
            exit 1
          fi
          echo "Decoded keystore: $(wc -c < "$KEYSTORE") bytes"

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$KS_PASS" > "${RUNNER_TEMP}/entries.txt" 2>&1; then
            echo "::error title=ANDROID_KEYSTORE_PASSWORD is wrong::keytool cannot open the keystore with it. keytool said:"
            sed 's/^/  /' "${RUNNER_TEMP}/entries.txt"
            exit 1
          fi

          ALIASES="$(sed -n 's/^\([^,]*\),.*/\1/p' "${RUNNER_TEMP}/entries.txt" | tr '\n' ' ')"
          echo "Aliases present in keystore: ${ALIASES:-<none>}"
          if ! sed -n 's/^\([^,]*\),.*/\1/p' "${RUNNER_TEMP}/entries.txt" | grep -qx "$KEY_ALIAS"; then
            echo "::error title=ANDROID_KEY_ALIAS is wrong::it is set to '${KEY_ALIAS}' but the keystore contains: ${ALIASES:-<none>}. It must match the -alias used with keytool -genkeypair."
            exit 1
          fi

          SIGN_ARGS=(--ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:${KS_PASS}" --key-pass "pass:${KEY_PASS}")
        else
          # Never fail here. CI's job is to hand back an installable APK, and an unfinished
          # secret setup must not take that away -- an earlier version of this action exited 1
          # on a partial configuration, which skipped the upload and left nothing to install.
          # It must not pass silently either: a throwaway key means the next build cannot
          # upgrade over this one, and an uninstall wipes the app's database.
          MISSING=""
          [ -n "$KS_B64" ]    || MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -n "$KEY_ALIAS" ] || MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -n "$KS_PASS" ]   || MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_PASS" ]  || MISSING="$MISSING ANDROID_KEY_PASSWORD"
          echo "::warning title=Throwaway signing key::Signing with a freshly generated key because these repository secrets are not set:${MISSING}. The APK installs, but Android requires a matching signature to upgrade, so the next build will need an uninstall first -- and an uninstall wipes the app database. Add them at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"

          KS_PASS="${KS_PASS:-android}"
          KEY_PASS="${KEY_PASS:-android}"
          KEY_ALIAS="${KEY_ALIAS:-ci-throwaway}"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Haust Class Schedule CI, OU=CI, O=HAUST, L=Luoyang, ST=Henan, C=CN"

          SIGN_ARGS=(--ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:${KS_PASS}" --key-pass "pass:${KEY_PASS}")
        fi

        if ! "$APKSIGNER" sign "${SIGN_ARGS[@]}" --out "$OUTPUT_APK" "$UNSIGNED_APK" > "${RUNNER_TEMP}/sign.log" 2>&1; then
          echo "::error title=apksigner failed::captured output follows. The usual cause is ANDROID_KEY_PASSWORD differing from the key password used when the keystore was created."
          sed 's/^/  /' "${RUNNER_TEMP}/sign.log"
          exit 1
        fi

        "$APKSIGNER" verify --print-certs "$OUTPUT_APK" | head -n 5

        echo "signed=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
