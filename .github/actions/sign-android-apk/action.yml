name: Sign Android APK
description: Sign a release APK with the project keystore, so upgrades install in place.

# Why this is shared rather than inlined in each workflow: ci.yml and release-android.yml
# both need to sign, and two copies of the same keytool/apksigner invocation drift apart.
#
# Composite actions cannot read `secrets` directly, so every secret arrives as an input and
# the calling workflow does the `${{ secrets.X }}` lookup.

inputs:
  unsigned-apk:
    description: Path to the APK produced by the build.
    required: true
  output-apk:
    description: Path to write the signed APK to.
    required: true
  keystore-base64:
    description: Base64 of the release keystore. Empty falls back to a throwaway key.
    required: false
    default: ""
  keystore-password:
    description: Keystore password.
    required: false
    default: ""
  key-alias:
    description: Key alias inside the keystore.
    required: false
    default: ""
  key-password:
    description: Password for that key.
    required: false
    default: ""

outputs:
  signed-apk:
    description: Path of the signed APK.
    value: ${{ steps.sign.outputs.signed }}

runs:
  using: composite
  steps:
    - name: Sign
      id: sign
      shell: bash
      env:
        KS_B64: ${{ inputs.keystore-base64 }}
        KS_PASS: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASS: ${{ inputs.key-password }}
        UNSIGNED_APK: ${{ inputs.unsigned-apk }}
        OUTPUT_APK: ${{ inputs.output-apk }}
      run: |
        set -euo pipefail

        KEYSTORE="${RUNNER_TEMP}/release.jks"
        rm -f "$KEYSTORE"

        if [ -z "$KS_B64" ]; then
          # Deliberately still build something installable when the secrets are absent, so a
          # missing secret is a warning rather than a red CI. But say so loudly: a throwaway
          # key means the next build cannot upgrade over this one.
          echo "::warning title=Throwaway signing key::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a freshly generated key. It installs, but Android requires a matching signature to upgrade, so the next build will need an uninstall first. Add the ANDROID_KEYSTORE_* secrets to make upgrades work in place."
          KS_PASS="${KS_PASS:-android}"
          KEY_PASS="${KEY_PASS:-android}"
          KEY_ALIAS="${KEY_ALIAS:-ci-throwaway}"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Haust Class Schedule CI, OU=CI, O=HAUST, L=Luoyang, ST=Henan, C=CN"
        else
          echo "Signing with the project keystore from secrets."
          printf '%s' "$KS_B64" | base64 -d > "$KEYSTORE"
          if [ -z "$KEY_ALIAS" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error title=Incomplete signing secrets::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi
        fi

        BUILD_TOOLS="$(ls -1 "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -n 1)"
        "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" sign \
          --ks "$KEYSTORE" \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass "pass:${KS_PASS}" \
          --key-pass "pass:${KEY_PASS}" \
          --out "$OUTPUT_APK" \
          "$UNSIGNED_APK"

        "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$OUTPUT_APK" | head -n 5

        echo "signed=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
