name: Build Android APK
description: Setup Android/Node/Rust environment and build Tauri Android APK.

inputs:
  ndk-version:
    description: Android NDK version to install.
    required: false
    default: "27.0.11902837"

runs:
  using: composite
  steps:
    # All action versions below are pinned to their current major on purpose. The older
    # ones target the Node 20 runtime, which GitHub is retiring -- the runners force them
    # onto Node 24 and the job dies at "Setup Android SDK" before any real work happens
    # (18 s in, versus many minutes for an actual build). Do not downgrade these, and do
    # not paper over it with ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION.
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android NDK
      shell: bash
      run: sdkmanager "ndk;${{ inputs.ndk-version }}"

    - name: Export Android env
      shell: bash
      run: |
        echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}" >> "$GITHUB_ENV"
        echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Rust
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        cache-targets: true

    - name: Install frontend dependencies
      shell: bash
      run: npm ci

    - name: Init Android project
      shell: bash
      run: npx tauri android init

    - name: Apply app icon
      shell: bash
      # tauri android init writes the stock Tauri launcher icons into the generated project and
      # never looks at src-tauri/icons, so without this step the APK ships with the default
      # Tauri icon. `tauri icon` overwrites them in place when it finds
      # gen/android/app/src/main/res next to the icons directory, and it also writes the adaptive
      # icon (mipmap-anydpi-v26/ic_launcher.xml plus a background colour) that the template
      # lacks; without that file Android 8+ launchers fall back to the legacy square icon.
      # "--output" keeps the desktop-size files it also produces out of the tracked
      # src-tauri/icons (it resolves the gen/ paths from the output directory's parent, so the
      # scratch directory has to sit directly in src-tauri).
      #
      # The template's launcher PNGs are deleted first. They have the same file names the CLI
      # writes, so leaving them would make the existence check below pass even if nothing was
      # generated.
      run: |
        set -euo pipefail
        manifest=src-tauri/icons/app-icon.json
        res=src-tauri/gen/android/app/src/main/res
        for f in "$manifest" src-tauri/icons/app-icon.png src-tauri/icons/app-icon-android-fg.png; do
          if [ ! -f "$f" ]; then
            echo "::error::Missing icon source $f."
            exit 1
          fi
        done
        if [ ! -d "$res" ]; then
          echo "::error::$res does not exist; tauri android init produced no Android project."
          exit 1
        fi
        rm -f "$res"/mipmap-*/ic_launcher*.png
        rm -rf "$res/mipmap-anydpi-v26"
        npx tauri icon "$manifest" --output src-tauri/icon-out
        rm -rf src-tauri/icon-out
        expected=(
          mipmap-anydpi-v26/ic_launcher.xml
          values/ic_launcher_background.xml
          mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}/ic_launcher{,_round,_foreground}.png
        )
        missing=0
        for f in "${expected[@]}"; do
          if [ ! -f "$res/$f" ]; then
            echo "::error::tauri icon did not write $res/$f"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "Launcher icons:"
        find "$res" -name 'ic_launcher*' -type f | sort

    - name: Build Android APK
      shell: bash
      run: npx tauri android build --apk --target aarch64
