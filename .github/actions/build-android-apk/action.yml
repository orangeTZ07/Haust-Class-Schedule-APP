name: Build Android APK
description: Setup Android/Node/Rust environment and build Tauri Android APK.

inputs:
  ndk-version:
    description: Android NDK version to install.
    required: false
    default: "27.0.11902837"

runs:
  using: composite
  steps:
    # All action versions below are pinned to their current major on purpose. The older
    # ones target the Node 20 runtime, which GitHub is retiring -- the runners force them
    # onto Node 24 and the job dies at "Setup Android SDK" before any real work happens
    # (18 s in, versus many minutes for an actual build). Do not downgrade these, and do
    # not paper over it with ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION.
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android NDK
      shell: bash
      run: sdkmanager "ndk;${{ inputs.ndk-version }}"

    - name: Export Android env
      shell: bash
      run: |
        echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}" >> "$GITHUB_ENV"
        echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Rust
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        cache-targets: true

    - name: Install frontend dependencies
      shell: bash
      run: npm ci

    - name: Init Android project
      shell: bash
      run: npx tauri android init

    - name: Build Android APK
      shell: bash
      run: npx tauri android build --apk --target aarch64
