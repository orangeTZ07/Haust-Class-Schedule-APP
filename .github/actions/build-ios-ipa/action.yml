name: Build iOS IPA (unsigned)
description: Setup Node/Rust/Xcode environment and produce an unsigned Tauri iOS .ipa.

inputs:
  configuration:
    description: Xcode build configuration (Release or Debug).
    required: false
    default: Release

outputs:
  ipa-path:
    description: Path to the produced unsigned .ipa.
    value: ${{ steps.package.outputs.ipa-path }}
  app-name:
    description: Display name of the built app bundle.
    value: ${{ steps.locate.outputs.app-name }}

runs:
  using: composite
  steps:
    # Action versions are pinned to their current major, matching build-android-apk. The
    # older ones target the Node 20 runtime that GitHub is retiring, and a forced upgrade
    # to Node 24 kills the job seconds in. Do not downgrade these.
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        # cache: npm hard-fails when no lock file exists at the repo root. This action always
        # runs against the full project, but the guard keeps a misconfigured checkout (or a
        # test repo holding only these workflow files) failing on its real missing piece
        # instead of this line.
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    - name: Install Rust with the iOS target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios

    - name: Put Cargo on PATH
      shell: bash
      # Tauri's Xcode build phase shells out to cargo, and Xcode build phases do not inherit
      # the runner's login shell. Without this the phase cannot find cargo even though rustup
      # installed it.
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        cache-targets: true

    - name: Install frontend dependencies
      shell: bash
      run: npm ci

    - name: Prebuild the Rust core for iOS
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
      # The Xcode "Build Rust" phase does this anyway, but a Rust error inside an Xcode phase
      # is buried in a log that hides it. Compiling here first surfaces it as its own step.
      run: |
        set -euo pipefail
        if [ "$CONFIGURATION" = "Release" ]; then
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release
        else
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios
        fi

    - name: Init iOS project
      shell: bash
      run: npx tauri ios init --ci

    - name: Apply app icon
      shell: bash
      # tauri ios init writes the stock Tauri icon set into gen/apple/Assets.xcassets and never
      # looks at src-tauri/icons, so without this step the IPA ships with the default icon.
      # `tauri icon` overwrites that set in place when it finds gen/apple/Assets.xcassets next
      # to the icons directory; the "--output" below keeps the desktop-size files it also
      # produces out of the tracked src-tauri/icons (it resolves the gen/ paths from the
      # output directory's parent, so the scratch directory has to sit directly in src-tauri).
      #
      # The template's icons are deleted first. They have the same file names the CLI writes,
      # so leaving them would make the existence check below pass even if nothing was
      # generated. Every file the asset catalog's Contents.json names must exist afterwards.
      #
      # The generated PNGs are RGBA with an opaque alpha channel. That is fine for the unsigned
      # sideload IPA built here; an App Store upload would want the channel stripped.
      run: |
        set -euo pipefail
        manifest=src-tauri/icons/app-icon.json
        set_dir=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
        for f in "$manifest" src-tauri/icons/app-icon.png; do
          if [ ! -f "$f" ]; then
            echo "::error::Missing icon source $f."
            exit 1
          fi
        done
        if [ ! -d "$set_dir" ]; then
          echo "::error::$set_dir does not exist; tauri ios init produced no asset catalog."
          exit 1
        fi
        rm -f "$set_dir"/AppIcon-*.png
        npx tauri icon "$manifest" --output src-tauri/icon-out
        rm -rf src-tauri/icon-out
        missing=0
        while IFS= read -r name; do
          if [ ! -f "$set_dir/$name" ]; then
            echo "::error::tauri icon did not write $set_dir/$name"
            missing=1
          fi
        done < <(grep -o '"filename" *: *"[^"]*"' "$set_dir/Contents.json" | sed 's/.*: *"\(.*\)"/\1/')
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "App icon set:"
        ls -l "$set_dir"

    - name: Build unsigned IPA
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        CI: "true"
      # --no-sign is what makes an unsigned build possible: the CLI skips its signed "build"
      # pass, runs xcodebuild archive with CODE_SIGNING_ALLOWED=NO and friends on the command
      # line (which beats whatever the generated project says), and zips the .app from the
      # archive into an IPA itself. The flag exists since Tauri CLI 2.11.0. Without it the CLI
      # always runs a signed build first, and that needs an Apple Developer team that CI does
      # not have. An earlier revision tried to get around that by rewriting signing settings in
      # the generated project file with sed; it never got far enough to prove it worked, because
      # the job always died at the package version check first.
      #
      # A failing exit must stay red. That same revision tolerated a non-zero exit on the theory
      # that Xcode "cannot sign" and the .app would still be left behind. The exit it was hiding
      # was the version check refusing to build, and tolerating it only moved the failure to the
      # next step with a misleading message.
      run: |
        set -euo pipefail
        args=(--ci --no-sign)
        if [ "$CONFIGURATION" = "Debug" ]; then
          args+=(--debug)
        fi
        npx tauri ios build "${args[@]}"

    - name: Locate build output
      id: locate
      shell: bash
      # The directory names come from the Cargo package (scheme) and productName (.app and IPA
      # file), so they are discovered here rather than hard-coded. sed -n 1p rather than head:
      # with pipefail, head quitting early can kill find with SIGPIPE and fail the step.
      run: |
        set -euo pipefail
        build=src-tauri/gen/apple/build
        app="$(find "$build" -maxdepth 4 -type d -name '*.app' -path '*.xcarchive/Products/Applications/*' | sed -n 1p)"
        ipa="$(find "$build" -maxdepth 3 -type f -name '*.ipa' | sed -n 1p)"
        if [ -z "$app" ] || [ -z "$ipa" ]; then
          echo "::error::tauri ios build finished but left no .app in the archive or no .ipa (app='$app', ipa='$ipa'). Listing $build:"
          find "$build" -maxdepth 5 2>/dev/null | head -n 60 || true
          exit 1
        fi
        echo "App bundle: $app"
        echo "CLI IPA: $ipa"
        echo "app-name=$(basename "$app")" >> "$GITHUB_OUTPUT"
        echo "cli-ipa=$ipa" >> "$GITHUB_OUTPUT"

    - name: Package unsigned IPA
      id: package
      shell: bash
      env:
        CLI_IPA: ${{ steps.locate.outputs.cli-ipa }}
      # The CLI already assembled a valid IPA (Payload/<name>.app); this only gives it a
      # predictable name and checks that the bundle is really inside before anything uploads it.
      # Checked via python3 zipfile: unzip -Z1 / BSD grep on macOS mangles multibyte UTF-8 names
      # (e.g. "Haust课程表.app") as binary or replacement characters.
      run: |
        set -euo pipefail
        python3 -c '
import sys, zipfile
ipa = sys.argv[1]
with zipfile.ZipFile(ipa, "r") as z:
    names = z.namelist()
    has_plist = any(n.startswith("Payload/") and n.endswith(".app/Info.plist") for n in names)
    if not has_plist:
        print(f"::error::{ipa} has no Payload/*.app/Info.plist; contents:", file=sys.stderr)
        for name in names[:40]:
            print(f"  {name}", file=sys.stderr)
        sys.exit(1)
' "$CLI_IPA"
        version="$(node -p "require('./package.json').version")"
        out="course-mngr-iOS-${version}-unsigned.ipa"
        cp "$CLI_IPA" "$out"
        ls -lh "$out"
        echo "ipa-path=$out" >> "$GITHUB_OUTPUT"
