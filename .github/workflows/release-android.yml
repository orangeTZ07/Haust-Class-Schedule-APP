name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NDK_VERSION: 27.0.11902837

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail before the build, not after it: the notes for this tag are produced from CHANGELOG.md
      # only at the end of the job, so without this a malformed or missing section is discovered
      # after the whole APK has been built. The script needs plain Node, which the runner image
      # already has.
      - name: Check changelog format
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-changelog.mjs --release "${TAG#v}"

      - name: Build Android APK
        uses: ./.github/actions/build-android-apk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No APK found"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # Signs with the project keystore from secrets, so a release can upgrade over the
      # previous one. Falls back to a throwaway key (with a warning) if the secrets are
      # missing.
      - name: Sign APK
        id: signed
        uses: ./.github/actions/sign-android-apk
        with:
          unsigned-apk: ${{ steps.apk.outputs.path }}
          output-apk: ${{ runner.temp }}/course-mngr-${{ github.ref_name }}-arm64.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare release icon
        id: icon
        run: |
          set -euo pipefail
          # app-icon.png, not icon.png: the older exports have black corners outside the rounded
          # square, which show up as a dark frame on the Release page.
          SRC="src-tauri/icons/app-icon.png"
          if [ ! -f "$SRC" ]; then
            echo "Missing app icon at $SRC"
            exit 1
          fi
          OUT="${RUNNER_TEMP}/app-icon.png"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this tag
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="${RUNNER_TEMP}/release-notes.md"

          {
            echo "![App Icon](https://github.com/${REPO}/releases/download/${TAG}/app-icon.png)"
            echo ""
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") { grab = 1 }
              grab && /^## \[/ && $0 !~ ("^## \\[" ver "\\]") { exit }
              grab { print }
            ' CHANGELOG.md
          } > "$OUT"

          # Body must still contain the version section, not only the icon line.
          if ! grep -q "^## \\[${VERSION}\\]" "$OUT"; then
            echo "CHANGELOG.md 里找不到版本节 ## [${VERSION}]。"
            echo "发版前请把 [Unreleased] 的内容移到对应版本节，再打 tag。"
            exit 1
          fi

          echo "----- release notes -----"
          cat "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.signed.outputs.signed-apk }}
            ${{ steps.icon.outputs.path }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The unsigned IPA goes up after the APK release, in its own job. needs: release means the
  # GitHub Release (APK, icon and changelog) is already published when this starts, so a macOS
  # runner shortage or an iOS build failure cannot hold up or break the Android release. The
  # release step then finds that release by tag and only uploads the file: with no body or
  # body_path given, softprops/action-gh-release keeps the existing release notes and flags.
  ios:
    name: Attach unsigned IPA
    runs-on: macos-15
    needs: release
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build iOS IPA
        id: build
        uses: ./.github/actions/build-ios-ipa

      - name: Attach IPA to the release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.ipa-path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
