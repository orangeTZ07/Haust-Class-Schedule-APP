name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand for any branch, instead of only by a push to main or a
  # pull request. Without it there is no way to get a branch compiled before a PR exists, which
  # matters when the change touches Rust or Kotlin and cannot be checked on the machine it was
  # written on.
  #
  # Note: this entry only appears in the Actions UI once the file is on the default branch, so it
  # takes effect after this lands on main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Status check name in GitHub: "Android"
  # Use this exact name when configuring branch rulesets.
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NDK_VERSION: 27.0.11902837

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Android APK
        uses: ./.github/actions/build-android-apk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      # The composite action only *builds*, and its output is an unsigned release APK --
      # Android refuses to install one. So this job used to be a pure pass/fail gate whose
      # APK was thrown away, which meant a pull request could not actually be installed and
      # tried on a phone. Sign it with an ephemeral key and publish it.
      #
      # Signing mirrors release-android.yml on purpose: extracting it into the shared
      # action would change the release path too, and that is out of scope here. Because
      # the key is ephemeral, each run's APK has a different signature -- switching between
      # CI builds means uninstalling the previous one first.
      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No APK found"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        id: signed
        uses: ./.github/actions/sign-android-apk
        with:
          unsigned-apk: ${{ steps.apk.outputs.path }}
          output-apk: ${{ runner.temp }}/course-mngr-ci-${{ github.run_number }}-arm64.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: course-mngr-apk-${{ github.run_number }}
          path: ${{ steps.signed.outputs.signed-apk }}
          if-no-files-found: error
          retention-days: 14

  # Status check name in GitHub: "Desktop (Windows)"
  #
  # Why this job exists: the Android job above cannot see desktop-only failures, and two of them
  # got all the way to a release before anyone noticed:
  #
  #   1. vite.config.ts had no server.watch.ignored, so Vite watched src-tauri/target/, met a .dll
  #      that cargo was still writing, and died with EBUSY. tauri dev then aborted because
  #      beforeDevCommand failed. This happens on every machine, on the first run, every time.
  #   2. tauri-plugin-http's setup() calls create_dir_all(app_cache_dir()), which failed with
  #      os error 5 on Windows and panicked the app during plugin initialisation.
  #
  # Neither is visible from an APK build, and neither is visible from `cargo build` either --
  # plugin setup runs at *runtime*. So the two smoke steps below actually start the app. That is
  # the whole point: a compile that succeeds says nothing about whether the thing comes up.
  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Build desktop binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Catches the tauri-plugin-http class: the binary compiles fine and then panics on startup.
      - name: Smoke run - the app must survive plugin initialisation
        shell: pwsh
        run: |
          $exe = "src-tauri\target\debug\course-mngr.exe"
          if (-not (Test-Path $exe)) { throw "desktop binary not found at $exe" }
          Write-Host "starting $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "the app exited during startup with code $($p.ExitCode). Plugin setup runs at runtime, so `cargo build` cannot catch this -- read the panic above."
          }
          Write-Host "still running after 15s: plugin initialisation succeeded"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      # Catches the vite.config.ts class: a dev-server watcher failure aborts beforeDevCommand, so
      # tauri dev never brings the app up. Only a real `tauri dev` reproduces it -- `npm run build`
      # does not, because it never starts the watcher.
      - name: Smoke run - tauri dev must bring the app up
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "tauri-dev.out.log"
          $err = Join-Path $env:RUNNER_TEMP "tauri-dev.err.log"
          $proc = Start-Process -FilePath "npm.cmd" -ArgumentList "run", "tauri", "dev" `
                    -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          $cameUp = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 10
            if (Get-Process -Name "course-mngr" -ErrorAction SilentlyContinue) { $cameUp = $true; break }
            if ($proc.HasExited) { break }
          }
          Write-Host "---- tauri dev stdout (tail) ----"
          Get-Content $out -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "---- tauri dev stderr (tail) ----"
          Get-Content $err -Tail 40 -ErrorAction SilentlyContinue
          Get-Process -Name "course-mngr" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $cameUp) {
            throw "tauri dev did not bring the app up within 5 minutes (see the logs above; a failing beforeDevCommand shows up here)"
          }
          Write-Host "tauri dev brought the app up"
