[package]
name = "course-mngr"
version = "0.1.0"
edition = "2021"

[lib]
name = "course_mngr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-reminder = { path = "plugins/reminder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"      # 针对体积进行优化，比 "3" 快且产物更小
lto = false          # 关闭耗时的全局链接优化
codegen-units = 16   # 增加并行编译单元，加快编译速度
panic = "abort"      # 异常直接退出，减小体积
strip = true         # 自动剥离符号表，进一步减小体积
