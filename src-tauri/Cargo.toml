[package]
name = "course-mngr"
version = "0.3.0"
edition = "2021"

[lib]
name = "course_mngr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Exact pins matching the last CI-green graph (tauri 2.11.0 + runtime 2.11.0) and the
# @tauri-apps/* packages in package-lock.json. A bare "2" / "~2.11" lets cargo float
# tauri-runtime to 2.12 (API break) or tauri to 2.12 (npm major.minor mismatch).
tauri = { version = "=2.11.0", features = [] }
tauri-runtime = "=2.11.0"
tauri-runtime-wry = { version = "=2.11.0", default-features = false }
tauri-utils = "=2.9.0"
tauri-macros = "=2.6.0"
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.5"
# 与 package.json 里 @tauri-apps/plugin-http ~2.5.9 同 major.minor；升级时两边一起改。
#
# 注意：这一条**不能**放在这个通用的 [dependencies] 里。cargo 的特性是**并集**，不是替换 ——
# 同一个 crate 在这里和 target 段里各写一次，两边的特性会被合并，关掉的那个照样生效。
# 所以它改成下面两个平台段各自声明一次（Android/iOS 保留 cookies，桌面关掉）。
#
# tauri-plugin-http = { version = "=2.5.9", features = ["unsafe-headers"] }   ← 不要放这里

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-http = { version = "=2.5.9", features = ["unsafe-headers"] }

# 桌面端：关掉 cookies。
#
# 原因（读的是插件源码）：tauri-plugin-http 2.5.9 的 setup() 里唯一的失败点就是
#     let cache_dir = app.path().app_cache_dir()?;
#     std::fs::create_dir_all(&cache_dir)?;      // ← Windows 桌面上报 os error 5（拒绝访问）
# 它失败会让整个插件初始化失败，app 直接 panic：
#     PluginInitialization("http", "拒绝访问。 (os error 5)")
# 关掉 cookies 就把那段代码整个编译掉，setup 里不再有任何会失败的操作。
#
# 代价：桌面端没有 cookie 罐。桌面端只用于在电脑上看 UI，且校外连不上教务系统，所以无所谓。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-http = { version = "=2.5.9", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration", "unsafe-headers"] }
tauri-plugin-reminder = { path = "plugins/reminder" }
tauri-plugin-system-bars = { path = "plugins/system-bars" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[profile.release]
opt-level = "s"      # 针对体积进行优化，比 "3" 快且产物更小
lto = false          # 关闭耗时的全局链接优化
codegen-units = 16   # 增加并行编译单元，加快编译速度
panic = "abort"      # 异常直接退出，减小体积
strip = true         # 自动剥离符号表，进一步减小体积
